name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: n8n-nodes-suno

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: n8n-nodes-suno/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - name: Root and package READMEs match
        run: cmp ../README.md README.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: n8n-nodes-suno/dist
          retention-days: 1

  runtime:
    # The built node runs on every supported Node.js version, with the n8n-workflow line n8n ships there.
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 18
            workflow: 1.83.0
          - node: 20
            workflow: 1.83.0
          - node: 22
            workflow: lockfile
          - node: 24
            workflow: lockfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: n8n-nodes-suno/dist
      - name: Install only n8n-workflow
        env:
          WORKFLOW: ${{ matrix.workflow }}
        run: |
          version="$WORKFLOW"
          if [ "$version" = lockfile ]; then version="$(node -p "require('./package-lock.json').packages['node_modules/n8n-workflow'].version")"; fi
          npm install --prefix "$RUNNER_TEMP/runtime" --ignore-scripts "n8n-workflow@$version"
          ln -s "$RUNNER_TEMP/runtime/node_modules" node_modules
      - run: node --test runtime-test/*.test.cjs
