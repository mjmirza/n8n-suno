# Publishes to npm when a version tag (v1.2.3) is pushed, as npm user nex8n via
# the NPM_TOKEN secret. --provenance attaches a signed statement linking the
# package to this exact commit (needs id-token: write).
name: Publish

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: n8n-nodes-suno

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: n8n-nodes-suno/package-lock.json
      - name: Tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Tag matches package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      - run: npm ci
      # The same gates as CI, so a tag cannot publish what main would reject.
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Root and package READMEs match
        run: cmp ../README.md README.md
      - name: Node metadata ships in the package
        run: test -f dist/nodes/Suno/Suno.node.json
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
