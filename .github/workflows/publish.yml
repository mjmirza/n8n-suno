# Publishes a version tag (v1.2.3) to npm as nex8n with signed provenance (needs id-token: write).
# The built node must pass the runtime tests on every supported Node.js version first.
name: Publish

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

defaults:
  run:
    working-directory: n8n-nodes-suno

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: n8n-nodes-suno/package-lock.json
      - name: Tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Tag matches package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      - run: npm ci
      # The same gates as CI, so a tag cannot publish what main would reject.
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - name: Root and package READMEs match
        run: cmp ../README.md README.md
      - name: Node metadata ships in the package
        run: test -f dist/nodes/Suno/Suno.node.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: n8n-nodes-suno/dist
          retention-days: 1

  runtime:
    # The built node runs on every supported Node.js version, with the n8n-workflow line n8n ships there.
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - node: 18
            workflow: 1.120.35
          - node: 20
            workflow: 1.120.35
          - node: 22
            workflow: lockfile
          - node: 24
            workflow: lockfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: n8n-nodes-suno/dist
      - name: Install only n8n-workflow
        env:
          WORKFLOW: ${{ matrix.workflow }}
        run: |
          version="$WORKFLOW"
          if [ "$version" = lockfile ]; then version="$(node -p "require('./package-lock.json').packages['node_modules/n8n-workflow'].version")"; fi
          npm install --prefix "$RUNNER_TEMP/runtime" --ignore-scripts "n8n-workflow@$version"
          ln -s "$RUNNER_TEMP/runtime/node_modules" node_modules
      - run: node --test runtime-test/*.test.cjs

  publish:
    needs: runtime
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Publishes the exact dist the runtime matrix tested. --ignore-scripts skips the prepublishOnly rebuild.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: n8n-nodes-suno/dist
      - run: npm publish --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
